# BoT-SORT configuration (Aharon et al., arXiv 2206.14651), as used for the
# released corpus. Ultralytics ships the tracker and its ReID weights.
#
# track_buffer IS SECRETLY HZ-COUPLED -- READ BEFORE CHANGING TRACK_FPS
# ------------------------------------------------------------------------
# Verified against ultralytics/trackers/track.py (on_predict_start): when
# tracking individual frames via model.track(frame, persist=True) (our
# calling pattern -- no video source for Ultralytics to read fps from), it
# ALWAYS instantiates the tracker with a hardcoded frame_rate=30, regardless
# of the pipeline's actual calling rate:
#     tracker = TRACKER_MAP[cfg.tracker_type](args=cfg, frame_rate=30)
# Internally: max_time_lost = int(frame_rate/30.0 * track_buffer). Since
# frame_rate is always 30, this collapses to max_time_lost = track_buffer
# exactly -- always, regardless of TRACK_FPS. That number is a raw CALL
# COUNT, not a duration; real-world occlusion memory = track_buffer /
# TRACK_FPS seconds. At TRACK_FPS=30 (main.py's setting) 90 is exactly 3
# real seconds. If TRACK_FPS ever changes, track_buffer must be re-set to
# (desired_real_seconds * 30) to keep the same real-world memory -- it will
# NOT scale itself, because Ultralytics never sees TRACK_FPS at all.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.25

# Occlusion memory = 3 real seconds at TRACK_FPS=30.
# Fragmentation experiment (paper Sec. X): dropping this to 5 -- an 18x
# reduction -- moved the track count from 50 to 51, i.e. track_buffer is not
# the fragmentation driver. Kept at the value used for the released corpus.
track_buffer: 90

# Fragmentation experiment (paper Sec. X): lowering this to 0.50 left
# fragmentation unchanged, and measured consecutive-frame IoU is ~0.90, so
# the threshold is never binding at 30 Hz. Kept at the value used for the
# released corpus.
match_thresh: 0.75

fuse_score: True

# Camera-motion compensation via sparse optical flow. This is the reason
# BoT-SORT replaced the ByteTrack+EMAP design: ego-motion is handled inside
# the tracker, before association, instead of being bolted on afterwards.
gmc_method: sparseOptFlow

proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: True
model: auto
